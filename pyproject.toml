[project]
name = "market-data-lakehouse-analytics"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.11,<3.13"

authors = [
  { name = "joaobarreto27", email = "joao.vito1951@gmail.com" }
]

[tool.poetry.dependencies]
pyspark = "3.5.4"
python-dotenv = "^1.2.2"
pyarrow = "^23.0.1"
setuptools = "^82.0.1"
boto3 = "^1.42.78"

[project.optional-dependencies]
dev = [
    "ruff (>=0.15.8,<0.16.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "taskipy (>=1.14.1,<2.0.0)",
    "pre-commit (>=4.5.1,<5.0.0)",
    "pip-audit (>=2.10.0,<3.0.0)",
    "bandit (>=1.9.4,<2.0.0)"
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["dags/etl/src"]
include = ["worker*", "infrastructure*", "dashboard*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "B", "I", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
files = ["src"]
mypy_path = ["src"]
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true

[tool.taskipy.tasks]
format = "ruff format ."
fix = "ruff check . --fix"
commit = "pre-commit run --all-files"
typecheck = "mypy dags/etl/src"
security = "bandit -r dags/etl/src -s B101"
audit = "pip-audit"
ci = """
task format
task fix
task typecheck
task security
task audit
task commit
"""

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
